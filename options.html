<!doctype html>
<meta charset="utf-8">
<title>github-utils options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #1f2328; }
  h1 { font-size: 20px; }
  label { display: block; font-weight: 600; margin-top: 20px; }
  input[type=text] { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; padding: 6px 8px; margin-top: 4px; }
  .hint { color: #59636e; margin: 4px 0 0; }
  .row { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
  #error { color: #cf222e; }
  #ok { color: #1a7f37; }
  #preview { font-family: ui-monospace, monospace; }
</style>
<h1>github-utils</h1>

<label for="pattern">Release label pattern</label>
<input id="pattern" type="text" spellcheck="false" autocomplete="off">
<p class="hint">
  A regular expression matched against the whole label name. The first capture group is
  shown as the release; without one, the whole label is shown. Case-sensitive.
</p>
<p id="error"></p>

<label for="sample">Try a label</label>
<input id="sample" type="text" value="release:0.1.0" spellcheck="false" autocomplete="off">
<p class="hint" id="result"></p>

<div class="row">
  <button id="save">Save</button>
  <button id="reset" type="button">Reset to default</button>
  <span id="ok"></span>
</div>
<script src="options.js"></script>
